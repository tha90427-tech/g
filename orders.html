<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders | ZHA BILL Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<script src="../data.js"></script>
<script src="admin.js"></script>
<script>
const content = renderAdminShell('orders.html', 'Orders');

content.innerHTML = `
  <div class="admin-card">
    <div class="toolbar">
      <input type="text" id="search" placeholder="🔍 Search by customer / phone...">
    </div>
    <table>
      <thead><tr><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="emptyMsg" style="display:none">No orders yet.</div>
  </div>
`;

function render(){
  const q = (document.getElementById('search').value||'').toLowerCase();
  const list = ZB.getBills().filter(b=>(b.customerName||'').toLowerCase().includes(q) || (b.customerPhone||'').includes(q));
  document.getElementById('tbody').innerHTML = list.map(b=>`
    <tr>
      <td class="muted">${new Date(b.date).toLocaleString('en-IN')}</td>
      <td>${b.customerName||'Walk-in'}${b.customerPhone?('<br><span class="muted" style="font-size:11px">'+b.customerPhone+'</span>'):''}</td>
      <td>${b.items.length} item(s)</td>
      <td class="amt">${money(b.total)}</td>
      <td>${b.paymentMethods.join(', ')}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-outline" style="padding:5px 10px" onclick='view(${JSON.stringify(b).replace(/'/g,"&apos;")})'>View</button>
        <button class="btn btn-danger" style="padding:5px 10px" onclick="remove('${b.id}')">🗑</button>
      </td>
    </tr>`).join('');
  document.getElementById('emptyMsg').style.display = list.length ? 'none' : 'block';
}

function view(b){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop show';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>Order detail</h3>
      <p class="muted" style="margin:0 0 8px">${new Date(b.date).toLocaleString('en-IN')}<br>${b.customerName||'Walk-in'} ${b.customerPhone?('· '+b.customerPhone):''}</p>
      <table><thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Amt</th></tr></thead><tbody>
      ${b.items.map(i=>`<tr><td>${i.name}</td><td>${i.qty}</td><td class="amt">₹${i.price}</td><td class="amt">₹${(i.qty*i.price).toFixed(2)}</td></tr>`).join('')}
      </tbody></table>
      <div class="perf"></div>
      <div class="flex-between"><b>Grand Total</b><b class="amt">${money(b.total)}</b></div>
      <div class="modal-actions"><button class="btn btn-primary" id="closeBtn">Close</button></div>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#closeBtn').onclick = ()=>backdrop.remove();
}

function remove(id){
  if(confirmDelete('this order')){ ZB.deleteBill(id); render(); toast('Order deleted'); }
}

document.getElementById('search').addEventListener('input', render);
render();
</script>
</body>
</html>
