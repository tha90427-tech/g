<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | ZHA BILL</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="stamp-big">🧾</div>
    <h1 id="cardTitle">Admin Login</h1>
    <p class="sub" id="cardSub">Sign in to manage ழா BILL</p>

    <div class="login-error" id="loginError"></div>

    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" required placeholder="admin@zhabill.com" autocomplete="username">
      <label>Password</label>
      <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn" style="margin-top:16px">Log In</button>
    </form>

    <p class="login-note" id="setupNote"></p>
  </div>
</div>

<script src="../data.js"></script>
<script>
const form = document.getElementById('loginForm');
const errBox = document.getElementById('loginError');
const isFirstRun = !ZB.adminExists();

if(isFirstRun){
  document.getElementById('cardTitle').textContent = 'Create Admin Account';
  document.getElementById('cardSub').textContent = 'First time setup — this becomes your login';
  document.getElementById('submitBtn').textContent = 'Create Account & Log In';
  document.getElementById('setupNote').textContent =
    'This is a static, client-side app: the password is stored (hashed) in this browser only. Anyone with browser dev-tools access to this device could tamper with local data — do not use this for sensitive real-world admin data without adding a real backend.';
} else {
  document.getElementById('setupNote').textContent = 'Session stays active for 4 hours or until you log out.';
}

function showError(msg){
  errBox.textContent = msg;
  errBox.classList.add('show');
}

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  errBox.classList.remove('show');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if(password.length < 6){
    return showError('Password must be at least 6 characters.');
  }

  if(isFirstRun){
    await ZB.setAdminPassword(email, password);
    ZB.startSession();
    window.location.href = 'dashboard.html';
    return;
  }

  const ok = await ZB.verifyAdmin(email, password);
  if(!ok){
    return showError('Invalid email or password.');
  }
  ZB.startSession();
  window.location.href = 'dashboard.html';
});

// already logged in? skip straight to dashboard
if(!isFirstRun && ZB.hasValidSession()){
  window.location.href = 'dashboard.html';
}
</script>
</body>
</html>
